services:
  postgres-db:
    image: postgres:17-alpine
    container_name: crediya-postgres
    environment:
      POSTGRES_USER: crediya_user
      POSTGRES_PASSWORD: crediya_password.
      POSTGRES_DB: credi_ya_db
    ports:
      - "5432:5432"
    volumes:
      - crediya_data:/var/lib/postgresql/data
    restart: always

volumes:
  crediya_data: