server:
  port: 8081
spring:
  application:
    name: "loan-applications"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/.well-known/jwks.json
          issuer-uri: http://localhost:8080
  # Settings for AWS Secrets Manager
  #config:
  #  import: "aws-secretsmanager:${SECRET_PATH}"
  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5433/credi_ya_db_app
    user: crediya_app
    password: crediya_password.
    schemas: ms_app
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 10
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8081"
jwt:
  secret: ${JWT_SECRET:""}
  expiration: ${JWT_EXPIRATION:360000}

adapters:
  r2dbc:
    host: "localhost"
    port: 5433
    database: "credi_ya_db_app"
    schema: "ms_applications"
    username: "crediya_app"
    password: "crediya_password."
  email-validator:
    base_url: "http://localhost:8080"
    connect_timeout: 10000
    read_timeout: 10000
    default_retry_attempts: 1