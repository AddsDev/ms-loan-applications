pluginManagement {
    repositories {
        //mavenLocal()
        //maven { url = '...' }
        gradlePluginPortal()
    }
}

buildCache {
    local {
        directory = new File(rootDir, 'build-cache')
    }
}

rootProject.name = 'loan-applications'

include ':app-service'
include ':model'
include ':usecase'
project(':app-service').projectDir = file('./applications/app-service')
project(':model').projectDir = file('./domain/model')
project(':usecase').projectDir = file('./domain/usecase')
include ':logger-adapter'
project(':logger-adapter').projectDir = file('./infrastructure/driven-adapters/logger-adapter')
include ':r2dbc-postgresql'
project(':r2dbc-postgresql').projectDir = file('./infrastructure/driven-adapters/r2dbc-postgresql')
include ':reactive-web'
project(':reactive-web').projectDir = file('./infrastructure/entry-points/reactive-web')
include ':rest-email-validator'
project(':rest-email-validator').projectDir = file('./infrastructure/driven-adapters/rest-email-validator')
include ':rest-client'
project(':rest-client').projectDir = file('./infrastructure/helpers/rest-client')